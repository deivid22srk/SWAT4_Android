name: build

# Two builds from one workflow:
#   * app-only (default): public, contains NO game code. Compiles the launcher
#     and the runtime against ci/gen_stub and publishes the APK as a public
#     artifact. It installs and validates the game folder, but cannot run the
#     game (there are no recompiled functions).
#   * full: only when the GEN_REPO variable points at the private repository
#     holding gen.tar.zst (the recompiled C derived from the game). The APK is
#     published as an asset of a *private* release in that repository and is
#     never uploaded as a public artifact.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug or release"
        type: choice
        options: [debug, release]
        default: debug
      gen_tag:
        description: "release tag in GEN_REPO that carries gen.tar.zst (empty = GEN_TAG variable, then newest)"
        type: string
        default: ""
      jobs:
        description: "parallel compiles of recompiled code (1-2 GB RAM each)"
        type: string
        default: "3"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "runtime/**"
      - "tools/**"
      - "ci/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build-${{ github.ref }}-${{ github.event.inputs.build_type }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NDK_VERSION: "27.2.12479018"
  CMAKE_VERSION: "3.22.1"

jobs:
  apk:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs are capped at 6 h (360 min). Keep headroom for upload.
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 cmake;${{ env.CMAKE_VERSION }} ndk;${{ env.NDK_VERSION }}"

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          cmake --version | head -1
          $ANDROID_HOME/ndk/$NDK_VERSION/ndk-build --version || true

      # Touch overlay: pure-logic selftest + real-ABI link check (no SDK needed).
      # Fails the build before Gradle if the overlay logic or the C/C++ link broke.
      - name: Touch overlay selftest
        run: |
          sh scripts/test_touch.sh

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ---------------------------------------------------------------- gen/
      - name: Fetch gen/ from the private repository
        if: ${{ vars.GEN_REPO != '' }}
        env:
          GEN_REPO: ${{ vars.GEN_REPO }}
          GEN_TAG: ${{ github.event.inputs.gen_tag }}
          DEFAULT_TAG: ${{ vars.GEN_TAG }}
          GEN_TOKEN: ${{ secrets.GEN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GEN_TOKEN:-}" ]; then
            echo "::error::GEN_REPO is set but GEN_TOKEN is missing"; exit 1
          fi
          # Never print the token, and mask it if a later command echoes it.
          echo "::add-mask::$GEN_TOKEN"
          tag="${GEN_TAG:-${DEFAULT_TAG:-}}"
          if [ -z "$tag" ]; then
            tag=$(curl -sS -H "Authorization: Bearer $GEN_TOKEN" \
              "https://api.github.com/repos/$GEN_REPO/releases?per_page=1" \
              | python3 -c 'import sys,json; r=json.load(sys.stdin); print(r[0]["tag_name"] if r else "")')
          fi
          [ -n "$tag" ] || { echo "::error::no release with gen.tar.zst in $GEN_REPO"; exit 1; }
          echo "gen tag: $tag"
          url=$(curl -sS -H "Authorization: Bearer $GEN_TOKEN" \
            "https://api.github.com/repos/$GEN_REPO/releases/tags/$tag" \
            | python3 -c 'import sys,json; r=json.load(sys.stdin); print(next(a["url"] for a in r.get("assets",[]) if a["name"]=="gen.tar.zst"))')
          curl -sSL -H "Authorization: Bearer $GEN_TOKEN" -H "Accept: application/octet-stream" \
            -o /tmp/gen.tar.zst "$url"
          ls -l /tmp/gen.tar.zst
          mkdir -p gen
          tar --use-compress-program=unzstd -xf /tmp/gen.tar.zst -C gen
          # Fresh timestamps: archives keep old mtimes and Ninja would skip files.
          find gen -type f -exec touch {} +
          echo "FULL_BUILD=1" >> "$GITHUB_ENV"
          echo "gen files: $(find gen -name '*.c' | wc -l); modules: $(find gen -name '*_table.c' | wc -l)"
          du -sh gen

      - name: Verify gen/ before the build
        if: ${{ vars.GEN_REPO != '' }}
        run: |
          set -euo pipefail
          n=$(find gen -name '*.c' | wc -l)
          m=$(find gen -name '*_table.c' | wc -l)
          echo "gen/: $n C files, $m module tables"
          for t in exe core engine window windrv d3ddrv alaudio swatgame swatgui; do
            [ -f "gen/${t}_table.c" ] || { echo "::error::gen/${t}_table.c missing: gen/ is incomplete"; exit 1; }
          done
          grep -q 'g_fn_count_engine' gen/engine_table.c
          echo "::notice::these files are compiled into libmain.so by the Build APK step (CMake globs gen/*.c)"

      - name: Use ci/gen_stub (app-only)
        if: ${{ vars.GEN_REPO == '' }}
        run: |
          mkdir -p gen
          cp ci/gen_stub/* gen/
          echo "FULL_BUILD=0" >> "$GITHUB_ENV"
          echo "::notice::app-only build: no recompiled game code, the APK cannot start the game"

      # ---------------------------------------------------------------- build
      - name: Build APK
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
          JOBS: ${{ github.event.inputs.jobs || '3' }}
        run: |
          set -euo pipefail
          cd android
          tasks="assembleDebug"
          [ "$BUILD_TYPE" = "release" ] && tasks="assembleRelease"
          ./gradlew --no-daemon "$tasks" \
            -PndkVersion="$NDK_VERSION" \
            "-Dorg.gradle.jvmargs=-Xmx4g" \
            "-PgenJobs=$JOBS"
          ls -l app/build/outputs/apk/*/*.apk

      # The APK name says what it is, so nobody mistakes an app-only build for
      # a playable port.
      - name: Name the APK
        id: apk
        run: |
          set -euo pipefail
          BUILD_TYPE=${{ github.event.inputs.build_type || 'debug' }}
          src=$(ls android/app/build/outputs/apk/${BUILD_TYPE}/*.apk | head -1)
          if [ "$FULL_BUILD" = "1" ]; then
            name="SWAT4-${BUILD_TYPE}-${GITHUB_SHA::7}.apk"
          else
            name="SWAT4-${BUILD_TYPE}-apponly-${GITHUB_SHA::7}.apk"
          fi
          cp "$src" "/tmp/$name"
          echo "path=/tmp/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          sha256sum "/tmp/$name"

      - name: Upload public artifact (app-only only)
        if: ${{ env.FULL_BUILD == '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14

      - name: Publish to the private release
        if: ${{ env.FULL_BUILD == '1' }}
        env:
          GEN_REPO: ${{ vars.GEN_REPO }}
          GEN_TAG: ${{ github.event.inputs.gen_tag }}
          DEFAULT_TAG: ${{ vars.GEN_TAG }}
          GH_TOKEN: ${{ secrets.GEN_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GEN_TAG:-${DEFAULT_TAG:-apk-latest}}"
          gh release view "$tag" --repo "$GEN_REPO" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GEN_REPO" --title "SWAT 4 APK" \
              --notes "Private builds of the port. Contains code recompiled from the game; do not redistribute." --prerelease
          gh release upload "$tag" "${{ steps.apk.outputs.path }}" --repo "$GEN_REPO" --clobber
          echo "::notice::APK uploaded to the private release $GEN_REPO@$tag"